services:
  - type: web
    name: football-prediction
    env: python
    plan: free
    region: oregon
    rootDir: .
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: |
      bash -c "python -m alembic upgrade head && python -m backend.seed.seed && python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT --workers 1"
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_URL
        value: https://football-prediction.onrender.com
      - key: DATABASE_URL
        value: sqlite:////var/data/predictpro.db
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_USERNAME
        value: admin
      - key: SEED_ADMIN_PASSWORD
        value: benard
      - key: SEED_ADMIN_EMAIL
        value: admin@example.com
      - key: ALLOWED_HOSTS
        value: football-prediction.onrender.com,localhost,127.0.0.1,testserver
      - key: FOOTBALL_API_KEY
        value: ""
      - key: FOOTBALL_COMPETITIONS
        value: PL,PD
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: ""
      - key: SMTP_PASSWORD
        value: ""
      - key: SMTP_FROM
        value: noreply@predictpro.local
      - key: SMTP_STARTTLS
        value: "true"
    disk:
      name: football-prediction-data
      mountPath: /var/data
      sizeGB: 1
